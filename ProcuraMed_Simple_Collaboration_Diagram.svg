<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Sharp Black Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .node-box { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 4; ry: 4; }
    .node-text { font-size: 14px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .conn-line { stroke: #000000; stroke-width: 1.5; fill: none; }
    .msg-label { font-size: 11.5px; font-weight: 600; fill: #000000; }
  </style>

  <!-- ==================== OBJECT NODES (5 ROLES) ==================== -->

  <!-- 1. Department Staff (Top Left) -->
  <rect x="60" y="60" width="180" height="55" class="node-box"/>
  <text x="150" y="93" class="node-text">:Department Staff</text>

  <!-- 2. Technical Officer (Top Right) -->
  <rect x="540" y="60" width="180" height="55" class="node-box"/>
  <text x="630" y="93" class="node-text">:Technical Officer</text>

  <!-- 3. Purchase Officer (Center Right) -->
  <rect x="540" y="240" width="180" height="55" class="node-box"/>
  <text x="630" y="273" class="node-text">:Purchase Officer</text>

  <!-- 4. Procurement Committee (Bottom Right) -->
  <rect x="540" y="420" width="195" height="55" class="node-box"/>
  <text x="637" y="453" class="node-text">:Procurement Committee</text>

  <!-- 5. Vendor (Bottom Left) -->
  <rect x="60" y="420" width="180" height="55" class="node-box"/>
  <text x="150" y="453" class="node-text">:Vendor</text>


  <!-- ==================== CONNECTIONS & NUMBERED MESSAGES ==================== -->

  <!-- 1. Staff to Tech Officer -->
  <line x1="240" y1="87" x2="532" y2="87" class="conn-line" marker-end="url(#arrow)"/>
  <text x="390" y="77" class="msg-label" text-anchor="middle">1: Submit Purchase Request</text>

  <!-- 2. Tech Officer to Purchase Officer -->
  <line x1="630" y1="115" x2="630" y2="232" class="conn-line" marker-end="url(#arrow)"/>
  <text x="640" y="175" class="msg-label" text-anchor="start">2: Verify Technical Specs</text>

  <!-- 3. Purchase Officer to Vendor (RFQ) -->
  <line x1="540" y1="260" x2="248" y2="430" class="conn-line" marker-end="url(#arrow)"/>
  <text x="360" y="325" class="msg-label" text-anchor="middle">3: Issue RFQ</text>

  <!-- 4. Vendor to Procurement Committee -->
  <line x1="240" y1="447" x2="532" y2="447" class="conn-line" marker-end="url(#arrow)"/>
  <text x="390" y="437" class="msg-label" text-anchor="middle">4: Submit Quotations</text>

  <!-- 5. Procurement Committee to Purchase Officer -->
  <line x1="610" y1="420" x2="610" y2="303" class="conn-line" marker-end="url(#arrow)"/>
  <text x="500" y="365" class="msg-label" text-anchor="end">5: Recommend Vendor</text>

  <!-- 6. Purchase Officer to Vendor (Purchase Order) -->
  <line x1="540" y1="280" x2="248" y2="450" class="conn-line" marker-end="url(#arrow)"/>
  <text x="410" y="380" class="msg-label" text-anchor="middle">6: Issue Purchase Order</text>

  <!-- 7. Vendor to Department Staff (Deliver Goods) -->
  <line x1="130" y1="420" x2="130" y2="123" class="conn-line" marker-end="url(#arrow)"/>
  <text x="120" y="270" class="msg-label" text-anchor="end">7: Deliver Goods</text>

  <!-- 8. Department Staff to Purchase Officer (Confirm Delivery / GRN) -->
  <line x1="240" y1="105" x2="532" y2="250" class="conn-line" marker-end="url(#arrow)"/>
  <text x="360" y="195" class="msg-label" text-anchor="middle">8: Confirm Delivery (GRN)</text>

</svg>
