<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <style>
    .uml-box { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 4; ry: 4; }
    .uml-title { font-size: 14px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .uml-sub { font-size: 11px; fill: #333333; text-anchor: middle; font-style: italic; }
    .link-line { stroke: #000000; stroke-width: 1.8; fill: none; }
    .dash-line { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
    .msg-text { font-size: 11px; font-weight: 600; fill: #000000; }
    .msg-num { font-weight: bold; }
    .header-title { font-size: 18px; font-weight: 800; fill: #000000; text-anchor: middle; letter-spacing: 0.5px; }
    .header-sub { font-size: 12px; fill: #444444; text-anchor: middle; }
  </style>

  <defs>
    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="480" y="38" class="header-title">UML COLLABORATION DIAGRAM: HOSPITAL PROCUREMENT PROCESS</text>
  <text x="480" y="58" class="header-sub">ProcuraMed Healthcare Procurement &amp; Supply Chain Management System</text>
  <line x1="120" y1="72" x2="840" y2="72" stroke="#000000" stroke-width="1.2"/>

  <!-- ==================== OBJECT BOXES ==================== -->
  
  <!-- 1. Department Staff (Top-Left) -->
  <g id="obj-staff">
    <rect x="70" y="110" width="200" height="60" class="uml-box"/>
    <text x="170" y="136" class="uml-title">:DepartmentStaff</text>
    <text x="170" y="154" class="uml-sub">(Requisition Initiator)</text>
  </g>

  <!-- 2. Technical Officer (Top-Right) -->
  <g id="obj-tech">
    <rect x="690" y="110" width="200" height="60" class="uml-box"/>
    <text x="790" y="136" class="uml-title">:TechnicalOfficer</text>
    <text x="790" y="154" class="uml-sub">(Equipment Evaluator)</text>
  </g>

  <!-- 3. Central System / Procurement Controller (Center) -->
  <g id="obj-system">
    <rect x="360" y="270" width="240" height="70" class="uml-box"/>
    <text x="480" y="300" class="uml-title">:ProcuraMedSystem</text>
    <text x="480" y="322" class="uml-sub">(Procurement Workflow Controller)</text>
  </g>

  <!-- 4. Procurement Committee (Bottom-Left) -->
  <g id="obj-committee">
    <rect x="70" y="470" width="200" height="60" class="uml-box"/>
    <text x="170" y="496" class="uml-title">:ProcurementCommittee</text>
    <text x="170" y="514" class="uml-sub">(Quotation Review &amp; Approval)</text>
  </g>

  <!-- 5. Purchase Officer (Bottom-Center) -->
  <g id="obj-po">
    <rect x="380" y="590" width="200" height="60" class="uml-box"/>
    <text x="480" y="616" class="uml-title">:PurchaseOfficer</text>
    <text x="480" y="634" class="uml-sub">(RFQ &amp; Contract Manager)</text>
  </g>

  <!-- 6. Vendor (Bottom-Right) -->
  <g id="obj-vendor">
    <rect x="690" y="470" width="200" height="60" class="uml-box"/>
    <text x="790" y="496" class="uml-title">:Vendor</text>
    <text x="790" y="514" class="uml-sub">(Supplies Provider / Bidder)</text>
  </g>

  <!-- ==================== COLLABORATION LINKS ==================== -->

  <!-- Link 1: Staff to System -->
  <line x1="220" y1="170" x2="400" y2="270" class="link-line"/>

  <!-- Link 2: Tech Officer to System -->
  <line x1="740" y1="170" x2="560" y2="270" class="link-line"/>

  <!-- Link 3: Committee to System -->
  <line x1="220" y1="470" x2="400" y2="340" class="link-line"/>

  <!-- Link 4: Purchase Officer to System -->
  <line x1="480" y1="590" x2="480" y2="340" class="link-line"/>

  <!-- Link 5: Vendor to System -->
  <line x1="740" y1="470" x2="560" y2="340" class="link-line"/>

  <!-- Link 6: Vendor to Staff Direct Logistics (Goods Receipt Inspection) -->
  <path d="M 690 520 C 480 540, 260 400, 180 170" class="dash-line"/>

  <!-- ==================== SEQUENCED MESSAGES ==================== -->

  <!-- Message 1: Staff -> System (Submit Requisition) -->
  <g transform="translate(190, 205)">
    <line x1="0" y1="0" x2="45" y2="25" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="-40" y="-8" class="msg-text">1: submitRequisition(itemDetails, budget)</text>
  </g>

  <!-- Message 2: System -> Tech Officer (Request Technical Spec Evaluation) -->
  <g transform="translate(585, 230)">
    <line x1="0" y1="20" x2="45" y2="-10" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="15" y="4" class="msg-text">2: notifyPendingEvaluation(specs)</text>
  </g>

  <!-- Message 3: Tech Officer -> System (Record Technical Compliance) -->
  <g transform="translate(685, 205)">
    <line x1="0" y1="-10" x2="-45" y2="20" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="-130" y="-8" class="msg-text">3: submitTechnicalEvaluation(status, remarks)</text>
  </g>

  <!-- Message 4: Purchase Officer -> System (Issue RFQ to Eligible Vendors) -->
  <g transform="translate(425, 520)">
    <line x1="0" y1="20" x2="0" y2="-30" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="-165" y="-5" class="msg-text">4: publishRFQ(rfqNumber, vendors)</text>
  </g>

  <!-- Message 5: System -> Vendor (Distribute RFQ Opportunity) -->
  <g transform="translate(580, 395)">
    <line x1="-15" y1="-10" x2="30" y2="20" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="10" y="32" class="msg-text">5: notifyRFQOpportunity(rfqDetails)</text>
  </g>

  <!-- Message 6: Vendor -> System (Submit Commercial Quotation with PDF) -->
  <g transform="translate(670, 415)">
    <line x1="25" y1="18" x2="-25" y2="-18" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="-155" y="-12" class="msg-text">6: submitQuotation(prices, leadTime, quotePDF)</text>
  </g>

  <!-- Message 7: Committee -> System (Compare Quotations & Recommend) -->
  <g transform="translate(230, 395)">
    <line x1="-25" y1="22" x2="25" y2="-22" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="-175" y="4" class="msg-text">7: compareAndRecommend(rfqId, remarks)</text>
  </g>

  <!-- Message 8: Committee -> System (Sanction Formal Board Approval) -->
  <g transform="translate(210, 420)">
    <line x1="-25" y1="22" x2="25" y2="-22" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="-150" y="22" class="msg-text">8: approveRecommendation(approvalId)</text>
  </g>

  <!-- Message 9: Purchase Officer -> System (Award Contract & Generate PO) -->
  <g transform="translate(535, 470)">
    <line x1="0" y1="20" x2="0" y2="-25" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="10" y="0" class="msg-text">9: issuePurchaseOrder(poDetails, vendorId)</text>
  </g>

  <!-- Message 10: System -> Vendor (Transmit Legal PO) -->
  <g transform="translate(730, 450)">
    <line x1="0" y1="-20" x2="0" y2="15" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="10" y="0" class="msg-text">10: transmitPOContract(poNumber)</text>
  </g>

  <!-- Message 11: Vendor -> Staff (Consignment Delivery & Goods Receipt) -->
  <g transform="translate(370, 430)">
    <line x1="30" y1="15" x2="-30" y2="-15" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="-170" y="24" class="msg-text">11: deliverConsignment(items, deliveryNote)</text>
  </g>

  <!-- Message 12: Staff -> System (Inspect Goods & Generate GRN) -->
  <g transform="translate(180, 240)">
    <line x1="-15" y1="-10" x2="25" y2="15" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="-150" y="28" class="msg-text">12: inspectAndVerifyGoods(grnStatus)</text>
  </g>

  <!-- ==================== FOOTER / LEGEND ==================== -->
  <g transform="translate(70, 675)">
    <rect x="0" y="0" width="820" height="32" fill="#fafafa" stroke="#000000" stroke-width="1"/>
    <text x="20" y="20" font-size="11px" font-weight="bold" fill="#000000">Legend:</text>
    <line x1="80" y1="16" x2="110" y2="16" stroke="#000000" stroke-width="1.8"/>
    <text x="115" y="20" font-size="11px" fill="#000000">Communication Link</text>
    <line x1="240" y1="16" x2="270" y2="16" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="275" y="20" font-size="11px" fill="#000000">Physical Delivery Flow</text>
    <line x1="420" y1="16" x2="445" y2="16" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="455" y="20" font-size="11px" fill="#000000">Numbered Message &amp; Direction</text>
    <text x="660" y="20" font-size="11px" font-style="italic" fill="#333333">Standard UML 2.0 Communication Notation</text>
  </g>
</svg>
